schema_version = "1.4"

artifacts = [
  { source = "/app/Submission.lean", destination = "submission/Submission.lean" },
  { source = "/app/Submission", destination = "submission/Submission" },
]

[task]
name = {{ task_name_toml }}
description = {{ description_toml }}

[metadata]
benchmark = "AutoformBench"
book = {{ book_toml }}
source_condition = "source-free"

[verifier]
environment_mode = "separate"
timeout_sec = 6000.0
network_mode = "no-network"
user = "verifier"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 51200
gpus = 0
workdir = "/app"

[agent]
timeout_sec = 86400.0
network_mode = "no-network"
user = "agent"

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 51200
gpus = 0
network_mode = "no-network"
workdir = "/app"

[[environment.mcp_servers]]
name = "lean-repl"
transport = "stdio"
command = "/usr/local/bin/autoform-repl"

[[environment.mcp_servers]]
name = "loogle"
transport = "stdio"
command = "/usr/local/bin/autoform-loogle"
