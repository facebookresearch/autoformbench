name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harbor-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
